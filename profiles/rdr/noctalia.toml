[theme]
builtin = "Noctalia"
community_palette = "Zenbones"
custom_palette = ""
mode = "dark"
pure_black_dark = false
shell_mode = "follow"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

[lockscreen]
blur_intensity = 0.5
edge_smoothness = 0.30000001192092896
tint_intensity = 0.30000001192092896
transition = ["fade"]
transition_duration = 1200

[shell]
app_icon_colorize = false
button_borders = true
card_borders = true
corner_radius_scale = 1.0
font_family = "Geist Mono"
input_borders = true
popup_borders = true
popup_shadows = true
settings_window_translucent = false

[shell.animation]
enabled = true
speed = 1.0

[shell.shadow]
alpha = 0.550000011920929
direction = "down"

[shell.panel]
borders = true
list_item_background = false
shadow = true
transparency_mode = "soft"

[bar.Main]
auto_hide = false
background_opacity = 1.0
border = "outline"
border_width = 0.0
capsule = false
capsule_border_width = 1.0
capsule_fill = "surface_variant"
capsule_opacity = 1.0
capsule_padding = 6.0
capsule_thickness = 0.7599999904632568
compositor_blur = true
concave_edge_corners = true
contact_shadow = false
enabled = true
font_scale = 1.0
font_weight = 500
hover_highlight = true
layer = "top"
margin_edge = 0
margin_ends = 100
margin_opposite_edge = 0
padding = 14
panel_overlap = 1
position = "bottom"
radius = 12
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 12
radius_top_right = 12
reserve_space = true
scale = 1.0
shadow = true
show_on_workspace_switch = true
smart_auto_hide = false
thickness = 34
widget_spacing = 6
start = ["clock", "weather"]
center = ["group:g1"]
end = ["volume", "notifications", "tray", "session"]

[[bar.Main.capsule_group]]
accordion = false
accordion_direction = "end"
border = "secondary"
border_width = 1.0
enabled = true
fill = "on_primary"
id = "g1"
members = ["launcher", "workspaces"]
opacity = 1.0
padding = 6.0

[widget.clock]
type = "clock"

[widget.weather]
show_condition = false
type = "weather"

[widget.launcher]
glyph = "horseshoe"
type = "launcher"

[widget.workspaces]
empty_color = "outline"
focused_color = "on_surface"
font_scale = 1.5
font_weight = 600
label_source = "name"
max_label_chars = 4
occupied_color = "secondary"
scale = 0.6
show_labels = true
style = "minimal"
type = "workspaces"

[widget.volume]
font_scale = 0.8
type = "volume"

[widget.notifications]
hide_when_no_unread = true
type = "notifications"

[widget.tray]
drawer = true
type = "tray"

[widget.session]
capsule_fill = "error"
capsule_opacity = 0.5
capsule_radius = "auto"
type = "session"
