[appearance]
border_width = 2
outer_border_width = 0
corner_radius = 10
drag_opacity = 0.85

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3

[appearance.shadow]
enabled = true
softness = 12
offset_x = 0
offset_y = 3

[animation]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.overview]
enabled = true
curve = "spring:0.95,850"
workspace_curve = "spring:0.95,1000"

[animation.windows_move]
enabled = true
curve = "spring:0.85,1000"

[animation.workspaces]
enabled = true
style = "slide"
curve = "spring:0.92,900"

[animation.windows_out]
enabled = true
style = "popin"
scale = 0.96
curve = "spring:1,1200"

[animation.border]
enabled = true
curve = "spring:1,900"

[animation.windows_in]
enabled = true
style = "popin"
scale = 0.93
curve = "spring:0.92,900"

[layout]
gap = 8
